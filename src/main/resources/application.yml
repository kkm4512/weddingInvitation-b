spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  application:
    name: weddingInvitation-b

  # 기본 프로필: local (.env의 SPRING_PROFILES_ACTIVE로 오버라이드 가능)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  # JPA 공통 설정 (dialect는 Hibernate 7.x 자동 감지)
  jpa:
    show-sql: ${SHOW_SQL} # true 또는 false
    hibernate:
      ddl-auto: ${DDL_AUTO} # validate, update, create, create-drop 중 선택

  # Multipart 파일 업로드 크기 제한 (기본 1MB → MP3 등 대용량 파일 업로드 허용)
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT}

# Kakao OAuth2
kakao:
  client:
    id: ${KAKAO_CLIENT_ID}
    secret: ${KAKAO_CLIENT_SECRET}
  redirect:
    uri: ${KAKAO_REDIRECT_URI}

# Cloudflare R2
cloudflare:
  account:
    id: ${CLOUDFLARE_ACCOUNT_ID}
  access:
    key:
      id: ${CLOUDFLARE_ACCESS_KEY_ID}
  secret:
    access:
      key: ${CLOUDFLARE_SECRET_ACCESS_KEY}
  bucket:
    name: ${CLOUDFLARE_BUCKET_NAME}
    url: ${CLOUDFLARE_BUCKET_URL}
  public:
    image:
      url: ${CLOUDFLARE_PUBLIC_URL}

# Naver Maps Static API
naver:
  map:
    client:
      id: ${NAVER_MAP_CLIENT_ID}
      secret: ${NAVER_MAP_CLIENT_SECRET}

# JWT 설정
jwt:
  secret: ${JWT_SECRET}

# Logging 공통
logging:
  level:
    root: INFO
    com.example.weddingInvitation_b: DEBUG
